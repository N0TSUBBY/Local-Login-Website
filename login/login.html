<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/SignUp</title>
    <link rel="stylesheet" href="login.style.css">
</head>
<body>

<h1><a href="../index.html" class="title" >Demo</a></h1>

<div class="container">

	<div class="form-box active" id="login-form">
	<form action="">
			<h2>Login</h2>
			<input type="text" name="user" placeholder="user">
			<div class="password-box">
    <input type="password" name="password" placeholder="Password">
    <button type="button" onclick="showPassword(this)" class="show">Show</button>
</div>
			<p class="wrong"></p>
			<button class="submit "type="submit" name="login">Login</button>
			<p>Dont have an account? <a href="#" onclick="showForm('register-form')">Register </a></p>
		</form>
	</div>
	
	<div class="form-box" id="register-form">
	
		<form action="">
			<h2>Register</h2>
			<input type="text" name="name" placeholder="Name">
			<input type="email" name="email" placeholder="Email">
			<div class="password-box">
    <input type="password" name="password" placeholder="Password">
    <button type="button" onclick="showPassword(this)" class="show">Show</button>
</div>
			<button class="submit "type="submit" name="register">Register</button>
			<p>Allready have an account? <a href="#" onclick="showForm('login-form')">Login </a></p>
		</form>
		
	</div>

</div>


    <script src="login.script.js"></script>
</body>
</html>
